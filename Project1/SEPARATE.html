<!DOCTYPE html>
<html>
<head>
    <title>Admin Page</title>
    <link rel="stylesheet" href="./styles/separate.css">

</head>
<div id="dashboard-content"></div>

<form id="form">

    <select id="category" required>
        <option value="">Select Category</option>
        <option value="soccer">Soccer</option>
        <option value="spacex">SpaceX</option>
        <option value="mcsr">MCSR</option>
        <option value="baseball">Baseball</option>
        <option value="other">Other</option>
    </select>

    <br>

    <input type="date" id="date" required>

    <h1>Soccer</h1><br>
    <!-- Soccer -->
    <input type="text" id="opponent" placeholder="Opponent">
    <input type="text" id="score" placeholder="Score">

    <br>

    <h1>SpaceX</h1><br>
    <!-- SpaceX -->
    <input type="text" id="mission" placeholder="Mission Name">
    <input type="text" id="status" placeholder="Launch Status">

    <br>

    <h1>MCSR</h1><br>
    <!-- MCSR -->
    <input type="text" id="time" placeholder="Run Time">
    <input type="text" id="overworld" placeholder="Overworld">
    <input type="text" id="bastion" placeholder="Bastion">
    <input type="text" id="end_enter" placeholder="End Enter">

    <br>

    <h1>Baseball</h1><br>
    <!-- BASEBALL -->
    <input type="text" id="team" placeholder="Ballers or Giants">
    <input type="text" id="opponent" placeholder="Opponent">
    <input type="text" id="score" placeholder="Score">

    <br>

    <!--OTHER-->
    <h1>Other</h1><br>
    <input type="text" id="team" placeholder="Team">
    <input type="text" id="opponent" placeholder="Opponent">
    <input type="text" id="score" placeholder="Score"> 
    <input type="text" id="mission" placeholder="Mission">
    <input type="text" id="status" placeholder="Status">
    <input type="text" id="time" placeholder="Run Time">

    <br>

    <textarea id="notes" placeholder="Notes"></textarea>

    <br>

    <button type="submit">Submit</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./scripts/SEPARATE.js"></script>
</html>
