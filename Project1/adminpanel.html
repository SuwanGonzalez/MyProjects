<head>
    <link rel="stylesheet" href="adminpanel.css">
</head>

<body>

<div class="tab-container">

    <form id="form">

        <!-- Tab Headers -->
        <div class="tab-headers">
            <button type="button" class="tab-btn active" onclick="switchTab(event, 'tab1')">SpaceX</button>
            <button type="button" class="tab-btn" onclick="switchTab(event, 'tab2')">Soccer</button>
            <button type="button" class="tab-btn" onclick="switchTab(event, 'tab3')">Baseball</button>
            <button type="button" class="tab-btn" onclick="switchTab(event, 'tab4')">MCSR</button>
            <button type="button" class="tab-btn" onclick="switchTab(event, 'tab5')">Other</button>
        </div>


        <!-- SpaceX -->
        <div id="tab1" class="tab-content active">
            <h3>SpaceX</h3>

            <input type="date" id="date"><br><br>
            <input type="text" id="mission" placeholder="Mission Name"><br>
            <input type="text" id="status" placeholder="Launch Status"><br>

            <br>

            <textarea id="notes" placeholder="Notes"></textarea>

            <br>

            <button type="submit">Submit</button>
        </div>


        <!-- Soccer -->
        <div id="tab2" class="tab-content">
            <h3>Soccer</h3>

            <input type="date" id="date"><br>
            <input type="text" id="opponent" placeholder="Opponent"><br>
            <input type="text" id="score" placeholder="Score"><br>

            <br>

            <textarea id="notes" placeholder="Notes"></textarea>

            <br>

            <button type="submit">Submit</button>
        </div>


        <!-- Baseball -->
        <div id="tab3" class="tab-content">
            <h3>Baseball</h3>

            <input type="date" id="date"><br>
            <input type="text" id="team" placeholder="My Team"><br>
            <input type="text" id="score" placeholder="Score"><br>

            <br>

            <textarea id="notes" placeholder="Notes"></textarea>

            <br>

            <button type="submit">Submit</button>
        </div>


        <!-- MCSR -->
        <div id="tab4" class="tab-content">
            <h3>MCSR</h3>

            <input type="date" id="date"><br>
            <input type="text" id="time" placeholder="Run Time"><br>
            <input type="text" id="overworld" placeholder="Overworld"><br>
            <input type="text" id="bastion" placeholder="Bastion"><br>
            <input type="text" id="end_enter" placeholder="End Enter"><br>

            <br>

            <textarea id="notes" placeholder="Notes"></textarea>

            <br>

            <button type="submit">Submit</button>
        </div>


        <!-- Other -->
        <div id="tab5" class="tab-content">
            <h3>Other</h3>

            <input type="date" id="date"><br>

            <input type="text" id="team" placeholder="My Team"><br>
            <input type="text" id="opponent" placeholder="Opponent"><br>
            <input type="text" id="score" placeholder="Score"><br>

            <input type="text" id="mission" placeholder="Mission Name"><br>
            <input type="text" id="status" placeholder="Launch Status"><br>

            <input type="text" id="overworld" placeholder="Overworld"><br>
            <input type="text" id="bastion" placeholder="Bastion"><br>
            <input type="text" id="end_enter" placeholder="End Enter"><br>
            <input type="text" id="time" placeholder="Run Time"><br>

            <br>

            <textarea id="notes" placeholder="Notes"></textarea>

            <br>

            <button type="submit">Submit</button>
        </div>

    </form>

</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="adminpanel.js"></script>
</body>
